</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark">L</span><span><strong>License Creator</strong><small>Visual license PDF builder</small></span></a>
    <label class="autosave-control" for="autosaveToggle" title="ONにすると、このブラウザに入力内容を保存します">
      <span class="autosave-copy"><strong>自動保存</strong><small id="saveStatus">OFF</small></span>
      <input id="autosaveToggle" type="checkbox" role="switch" aria-label="自動保存">
      <span class="autosave-switch" aria-hidden="true"></span>
    </label>
  </header>

  <main class="layout">
    <aside class="editor">
      <div class="intro">
        <p class="eyebrow">SIMPLE BY DESIGN</p>
        <h1>見れば分かる、<br>作品のルール。</h1>
        <p>長い説明は減らして、<b>許可・要相談・禁止</b>を一目で伝えるPDFにします。</p>
      </div>

      <nav class="mode-tabs" aria-label="ライセンス形式">
        <button type="button" class="mode-tab active" data-mode="custom">カスタム</button>
        <button type="button" class="mode-tab" data-mode="cc">CC</button>
        <button type="button" class="mode-tab" data-mode="software">OSS</button>
      </nav>

      <section class="card">
        <div class="card-head"><span>1</span><div><strong>作品</strong><small>PDF上部に表示します</small></div></div>
        <div class="form-grid">
          <label class="field wide"><span>タイトル</span><input id="titleInput" type="text"></label>
          <label class="field"><span>作者</span><input id="creatorInput" type="text"></label>
          <label class="field"><span>作品名</span><input id="workNameInput" type="text"></label>
          <label class="field"><span>種類</span><select id="workTypeSelect"></select></label>
          <label class="field"><span>更新日</span><input id="updatedAtInput" type="date"></label>
          <label class="field wide"><span>連絡先・配布ページ（任意）</span><input id="contactInput" type="text" placeholder="URL / X / メールなど。空欄ならPDFに表示しません"></label>
        </div>
      </section>

      <section id="customSection" class="card">
        <div class="card-head"><span>2</span><div><strong>使い方</strong><small>7項目を 許可 / 要相談 / 禁止 から選びます</small></div></div>
        <label class="field"><span>プリセット</span><select id="presetSelect"></select></label>
        <div id="policyMatrix" class="policy-list"></div>

        <div class="mini-block">
          <span class="mini-title">クレジット</span>
          <div class="segmented" data-segment="credit">
            <button type="button" data-value="required">必須</button>
            <button type="button" data-value="recommended">推奨</button>
            <button type="button" data-value="none">不要</button>
          </div>
          <label class="field"><span>表記例</span><input id="creditTextInput" type="text"></label>
        </div>

        <details class="details-box">
          <summary>細かい禁止事項・補足</summary>
          <div class="details-body">
            <div class="check-grid">
              <label><input id="restrictionAdult" type="checkbox">成人向け</label>
              <label><input id="restrictionPolitical" type="checkbox">政治・宗教</label>
              <label><input id="restrictionNft" type="checkbox">NFT</label>
              <label><input id="restrictionHarmful" type="checkbox">違法・中傷</label>
              <label><input id="restrictionImpersonation" type="checkbox">公式を装う利用</label>
            </div>
            <label class="field"><span>補足</span><textarea id="notesInput" rows="4"></textarea></label>
          </div>
        </details>
      </section>

      <section id="ccSection" class="card" hidden>
        <div class="card-head"><span>2</span><div><strong>Creative Commons</strong><small>公式ライセンスを選択</small></div></div>
        <label class="field"><span>ライセンス</span><select id="ccLicenseSelect"></select></label>
        <div id="ccResultCard" class="result-card"></div>
      </section>

      <section id="softwareSection" class="card" hidden>
        <div class="card-head"><span>2</span><div><strong>OSSライセンス</strong><small>代表的なものから選択</small></div></div>
        <label class="field"><span>ライセンス</span><select id="softwareLicenseSelect"></select></label>
        <div id="softwareResultCard" class="result-card"></div>
        <label class="field"><span>適用範囲（任意）</span><textarea id="softwareScopeInput" rows="3" placeholder="例: ソースコードに適用"></textarea></label>
      </section>

      <section class="card">
        <div class="card-head"><span>3</span><div><strong>デザイン</strong><small>PDFの雰囲気だけ選びます</small></div></div>
        <div class="form-grid">
          <label class="field wide"><span>テーマ</span><select id="themeSelect"><option value="blue">Blue</option><option value="mint">Mint</option><option value="lavender">Lavender</option><option value="warm">Warm</option></select></label>
          <input id="accentInput" type="hidden" value="#5b7fb7">
          <label class="field wide"><span>右上のイラスト（任意）</span><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp"></label>
        </div>
        <div class="image-actions"><span id="imageLabel">画像なし</span><button id="resetImageButton" type="button">画像を外す</button></div>
        <div class="download-area">
          <button id="downloadPdfButton" class="download" type="button"><strong>PDFを書き出す</strong><small>A4・1ページ</small></button>
          <p id="statusMessage" role="status" aria-live="polite"></p>
        </div>
      </section>
    </aside>

    <section class="preview">
      <div class="preview-head"><div><p class="eyebrow">LIVE PREVIEW</p><strong>A4 / 1 page</strong></div></div>
      <div class="canvas-wrap"><canvas id="previewCanvas" width="1240" height="1754"></canvas></div>
    </section>
  </main>

  <script src="presets.js?v=20260815-0827"></script>
  <script src="local-date.js?v=20260815-1935"></script>

  <script src="credit-copy-fix.js?v=20260815-0827" defer></script>
  <script src="oss-polish.js?v=20260815-0827" defer></script>
  <script src="custom-panel-auto.js?v=20260815-0827" defer></script>
  <script src="credit-tone.js?v=20260815-0827" defer></script>
  <script src="credit-strip-final.js?v=20260815-0827" defer></script>
  <script src="header-polish.js?v=20260815-0827" defer></script>
  <script src="page-balance.js?v=20260815-0827" defer></script>
  <script src="image-editor.js?v=20260815-0827" defer></script>
  <script src="public-defaults-ui.js?v=20260815-0827" defer></script>
